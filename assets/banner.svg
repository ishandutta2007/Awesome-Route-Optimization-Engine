<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0a0f1d"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="routeGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
    <linearGradient id="routeGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" opacity="0.6"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bgGrad)"/>
  <rect width="1200" height="400" fill="url(#grid)"/>

  <!-- Radial Glow Behind Route Nodes -->
  <circle cx="880" cy="200" r="160" fill="#6366f1" opacity="0.12" filter="url(#glow)">
    <animate attributeName="r" values="140;180;140" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.08;0.18;0.08" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1020" cy="130" r="100" fill="#38bdf8" opacity="0.1" filter="url(#glow)"/>

  <!-- Static Track Lines -->
  <path d="M 740 280 L 820 180 L 920 220 L 1020 120 L 1110 170 L 1050 300 L 910 330 Z" 
        fill="none" stroke="#1e3a8a" stroke-width="3" stroke-dasharray="6 6" opacity="0.45"/>
  
  <!-- Dynamic Animated Route Path 1 -->
  <path d="M 740 280 L 820 180 L 920 220 L 1020 120 L 1110 170 L 1050 300 L 910 330 Z" 
        fill="none" stroke="url(#routeGrad1)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <animate attributeName="stroke-dasharray" values="20 200; 200 20; 20 200" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="stroke-dashoffset" values="0; 600" dur="8s" repeatCount="indefinite"/>
  </path>

  <!-- Dynamic Animated Route Path 2 -->
  <path d="M 740 280 L 780 340 L 880 300 L 980 340 L 1080 260 L 1140 180" 
        fill="none" stroke="url(#routeGrad2)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.85">
    <animate attributeName="stroke-dasharray" values="15 120; 120 15; 15 120" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="stroke-dashoffset" values="400; 0" dur="7s" repeatCount="indefinite"/>
  </path>

  <!-- Moving Delivery Vehicle Nodes -->
  <circle r="6" fill="#38bdf8" filter="url(#glow)">
    <animateMotion path="M 740 280 L 820 180 L 920 220 L 1020 120 L 1110 170 L 1050 300 L 910 330 Z" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="r" values="5;8;5" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <circle r="5" fill="#10b981" filter="url(#glow)">
    <animateMotion path="M 740 280 L 780 340 L 880 300 L 980 340 L 1080 260 L 1140 180" dur="6s" repeatCount="indefinite"/>
  </circle>

  <!-- Central Depot / Hub Node -->
  <g transform="translate(740, 280)">
    <circle r="18" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.4">
      <animate attributeName="r" values="12;28;12" dur="2.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0;0.7" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle r="11" fill="#0284c7" stroke="#e0f2fe" stroke-width="2.5"/>
    <text x="0" y="-18" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">CENTRAL DEPOT</text>
  </g>

  <!-- Stop Nodes with Pulse -->
  <g transform="translate(820, 180)">
    <circle r="7" fill="#818cf8" stroke="#fff" stroke-width="1.5"/>
    <text x="12" y="-5" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Stop 1 (TW 09:00)</text>
  </g>
  <g transform="translate(920, 220)">
    <circle r="6" fill="#38bdf8" stroke="#fff" stroke-width="1.5"/>
  </g>
  <g transform="translate(1020, 120)">
    <circle r="8" fill="#c084fc" stroke="#fff" stroke-width="1.5"/>
    <text x="12" y="-6" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Stop 2 (Pickup)</text>
  </g>
  <g transform="translate(1110, 170)">
    <circle r="6" fill="#38bdf8" stroke="#fff" stroke-width="1.5"/>
  </g>
  <g transform="translate(1050, 300)">
    <circle r="7" fill="#10b981" stroke="#fff" stroke-width="1.5"/>
    <text x="12" y="15" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Stop 3 (Drop-off)</text>
  </g>
  <g transform="translate(910, 330)">
    <circle r="6" fill="#38bdf8" stroke="#fff" stroke-width="1.5"/>
  </g>

  <!-- Left Content / Typography -->
  <g transform="translate(70, 85)">
    <!-- Top Pill Badge -->
    <rect x="0" y="0" width="220" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <circle cx="14" cy="14" r="5" fill="#10b981">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="26" y="18" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="0.6">ROUTE OPTIMIZATION</text>

    <!-- Main Title -->
    <text x="0" y="75" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="900" letter-spacing="-1">
      Awesome Route
    </text>
    <text x="0" y="122" fill="url(#accentGrad)" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="900" letter-spacing="-1">
      Optimization Engine ⚡
    </text>

    <!-- Subtitle -->
    <text x="0" y="165" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="400">
      Open-Source Solvers · VRP · TSP · Fleet Routing · Last-Mile Logistics
    </text>

    <!-- Framework Tags -->
    <g transform="translate(0, 195)">
      <rect x="0" y="0" width="85" height="24" rx="6" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.35)" stroke-width="1"/>
      <text x="42" y="16" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">VROOM</text>

      <rect x="95" y="0" width="95" height="24" rx="6" fill="rgba(129, 140, 248, 0.12)" stroke="rgba(129, 140, 248, 0.35)" stroke-width="1"/>
      <text x="142" y="16" fill="#818cf8" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">OR-Tools</text>

      <rect x="200" y="0" width="80" height="24" rx="6" fill="rgba(192, 132, 252, 0.12)" stroke="rgba(192, 132, 252, 0.35)" stroke-width="1"/>
      <text x="240" y="16" fill="#c084fc" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">OSRM</text>

      <rect x="290" y="0" width="90" height="24" rx="6" fill="rgba(16, 185, 129, 0.12)" stroke="rgba(16, 185, 129, 0.35)" stroke-width="1"/>
      <text x="335" y="16" fill="#10b981" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Valhalla</text>

      <rect x="390" y="0" width="115" height="24" rx="6" fill="rgba(251, 146, 60, 0.12)" stroke="rgba(251, 146, 60, 0.35)" stroke-width="1"/>
      <text x="447" y="16" fill="#fb923c" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">GraphHopper</text>
    </g>
  </g>
</svg>